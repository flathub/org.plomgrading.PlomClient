app-id: org.plomgrading.PlomClient
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: plom-client
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - dependencies.yaml

  - name: Plom
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=$FLATPAK_DEST --no-deps --no-build-isolation .
    sources:
      - type: archive
        url: https://pypi.io/packages/source/p/plom-client/plom_client-0.21.0.tar.gz
        sha256: 952145bc944b5235efea54d6b5d1f285756b0f7527ffad73a6204c7065c07ec8
        x-checker-data:
          type: anitya
          project-id: 376555
          stable-only: true
          url-template: https://pypi.io/packages/source/p/plom-client/plom_client-$version.tar.gz
